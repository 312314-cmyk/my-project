name: Claude Code Bot
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  claude-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Anthropic
        uses: anthropic/os-oauth-token-exchange@v1
        with:
          federation-rule-id: "fdrl_01LkYXNuJLxA1YA5EZfnjivK"
